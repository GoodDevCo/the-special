<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0e13">
<meta name="description" content="Today's food deals, verified by the crowd.">
<title>The Special — Daily Food Deals</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="logo"><div class="star">★</div><h1>The <span>Special</span></h1></div>
  <div class="tagline">Today's food deals, verified by the crowd</div>
  <div class="search">🔍<input id="q" placeholder="Search chains or deals…"></div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="feed"></main>

<button class="fab" id="fab" title="Post a find">+</button>
<div class="toast" id="toast"></div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <h2>Post a find 🎉</h2>
  <div class="sub">Spotted a special? Share it with everyone.</div>
  <button class="ig-import" id="ig-import">📸 Paste from Instagram</button>
  <div class="divider">or enter manually</div>
  <label>RESTAURANT / CHAIN</label>
  <input class="inp" id="f-chain" placeholder="e.g. Taco Bell">
  <label>THE DEAL</label>
  <input class="inp" id="f-deal" placeholder="e.g. $1 Meximelt with any purchase">
  <label>PRICE (OPTIONAL)</label>
  <input class="inp" id="f-price" placeholder="e.g. $1">
  <label>AVAILABLE ON</label>
  <div class="days" id="f-days"></div>
  <label>LINK (INSTAGRAM REEL, TIKTOK, WEBSITE…)</label>
  <input class="inp" id="f-link" placeholder="https://instagram.com/reel/…">
  <button class="submit" id="f-submit">Post it ⭐</button>
  <button class="cancel" id="f-cancel">Cancel</button>
</div>

<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
